name: Google reviews refresh

# Pulls reviews from the DAS Google Business Profile and commits the
# regenerated home-page reviews block. The commit to main triggers the
# normal Netlify deploy. See scripts/reviews/README.md for token setup.

on:
  schedule:
    - cron: "45 20 * * *" # 06:15 ACST daily, 15 min after the Facebook feed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google reviews
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ vars.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ vars.GBP_LOCATION_ID }}
          GBP_REVIEWS_URL: ${{ vars.GBP_REVIEWS_URL }}
        run: python3 scripts/reviews/fetch_reviews.py

      - name: Commit and push if changed
        run: |
          git config user.name "das-reviews[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add index.html reviews.json
          if git diff --cached --quiet; then
            echo "Reviews unchanged — nothing to deploy."
          else
            git commit -m "Auto-update Google reviews"
            git push
          fi
